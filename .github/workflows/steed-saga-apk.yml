name: 铁骑征途 APK

on:
  push:
    paths:
      - 'steed-saga/**'
      - '.github/workflows/steed-saga-apk.yml'
  pull_request:
    paths:
      - 'steed-saga/**'
      - '.github/workflows/steed-saga-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steed-saga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check JavaScript syntax
        run: for f in app/src/main/assets/game/js/*.js; do node --check "$f"; done
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SteedSaga-apk
          path: steed-saga/app/build/outputs/apk/release/app-release.apk
