name: PocketShell APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ssh-terminal-android/**"
      - ".github/workflows/pocketshell-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssh-terminal-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # 配置了签名 Secrets 就用固定密钥签名（可覆盖安装升级）；没配置则用临时 debug 密钥
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETSHELL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.POCKETSHELL_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.POCKETSHELL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: pocketshell
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocketShell-apk
          path: ssh-terminal-android/app/build/outputs/apk/release/*.apk
