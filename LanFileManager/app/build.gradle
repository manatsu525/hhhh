plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanfile.manager'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lanfile.manager'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0'
        // 7-Zip 原生库只打包手机常见架构（x86 只有模拟器在用）
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'lanfile123'
            keyAlias 'lanfile'
            keyPassword 'lanfile123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    packaging {
        // 压缩存放 .so，APK 体积小一半；安装时解压到 lib 目录
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/versions/9/module-info.class', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 压缩 / 解压
    implementation 'net.lingala.zip4j:zip4j:2.11.5'                                     // zip：AES/ZipCrypto 密码、GBK 文件名
    implementation 'org.apache.commons:commons-compress:1.27.1'                         // tar / gz / bz2 / xz / lzma / Z
    implementation 'org.tukaani:xz:1.9'
    // 7-Zip 引擎：7z、rar/rar5、iso、cab …（它声明依赖 appcompat，实际用不到，排除掉）
    implementation('com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03') { transitive = false }
}
