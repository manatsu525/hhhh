<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件互传</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --line:#e3e7ee; --text:#1c2430; --muted:#6b7686;
  --accent:#1f7a6d; --accent-soft:#e3f2ef; --me:#1f7a6d; --me-text:#fff; --other:#ffffff;
  --danger:#c2410c; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161c; --panel:#1a2029; --line:#2a323e; --text:#e6eaf0; --muted:#8c97a7;
  --accent:#3fb3a1; --accent-soft:#1d3532; --me:#2a8a7c; --me-text:#fff; --other:#222a35; --shadow:none;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:1080px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;fill:#fff}
.title{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa3ad}
.dot.on{background:#22a06b}
.tabs{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:7px}
.tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;position:relative}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.active{display:flex}
#msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:340px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.row{display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.row.me{align-items:flex-end}
.meta{font-size:11px;color:var(--muted);margin:0 4px 3px}
.bubble{max-width:min(620px,86%);padding:9px 12px;border-radius:12px;background:var(--other);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;position:relative}
.row.me .bubble{background:var(--me);color:var(--me-text);border-color:transparent}
.row.me .bubble a{color:#fff}
.bubble a{color:var(--accent)}
.bubble .acts{display:flex;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;padding:2px 8px;font-size:12px}
.row.me .chip{border-color:rgba(255,255,255,.4)}
.file{display:flex;align-items:center;gap:10px;min-width:220px;text-decoration:none;color:inherit}
.ficon{width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;text-transform:uppercase;overflow:hidden}
.row.me .ficon{background:rgba(255,255,255,.18);color:#fff}
.fname{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.fsize{font-size:12px;opacity:.75}
.thumb{display:block;max-width:260px;max-height:200px;border-radius:8px;margin-bottom:6px}
.prog{height:4px;background:rgba(255,255,255,.3);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--text);font:inherit;max-height:160px;min-height:40px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.ibtn{border:1px solid var(--line);background:var(--panel);color:var(--text);height:40px;min-width:40px;border-radius:10px;display:grid;place-items:center;padding:0 10px}
.ibtn svg{width:20px;height:20px;fill:currentColor}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:0 16px}
.drop{position:absolute;inset:0;background:rgba(31,122,109,.12);border:2px dashed var(--accent);border-radius:14px;display:none;place-items:center;font-size:16px;color:var(--accent);font-weight:600;z-index:5;pointer-events:none}
.drop.show{display:grid}
/* 文件浏览 */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
.crumbs button{border:0;background:none;color:var(--accent);padding:3px 6px;border-radius:6px}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs span{color:var(--muted)}
#list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:var(--bg)}
.it .ficon{width:34px;height:34px}
.it .ficon.dir{background:#fdf1d6;color:#b7791f}
@media (prefers-color-scheme: dark){.it .ficon.dir{background:#3a311d;color:#e5b45a}}
.it .nm{flex:1;min-width:0}
.it .nm div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{font-size:12px;color:var(--muted)}
.it .dlb{opacity:.75}
.note{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
/* 登录 */
#login{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:30;padding:16px}
#login.show{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow)}
.card h2{margin:12px 0 4px;font-size:18px}
.card p{margin:0 0 18px;color:var(--muted)}
.pin{width:100%;font-size:28px;letter-spacing:12px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);outline:none}
.pin:focus{border-color:var(--accent)}
.err{color:var(--danger);min-height:20px;margin-top:8px;font-size:13px}
.card .primary{width:100%;height:42px;border-radius:10px;margin-top:6px}
@media (max-width:600px){
  .app{padding:0 8px} .title{font-size:15px} .tabs button{padding:6px 10px}
  .fname{max-width:180px} .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></div>
    <div style="min-width:0">
      <div class="title" id="devName">文件互传</div>
      <div class="status"><span class="dot" id="dot"></span><span id="stText">连接中…</span></div>
    </div>
    <div class="tabs">
      <button class="active" data-tab="chat">消息</button>
      <button data-tab="files" id="tabFiles">手机文件</button>
    </div>
  </header>
  <main id="main">
    <div class="drop" id="drop">松开即可发送到手机</div>
    <section class="view active" id="v-chat">
      <div id="msgs"><div class="empty" id="empty"><b>还没有消息</b>在下方输入文字，或把文件 / 文件夹拖到这里发送给手机。也支持直接粘贴截图。</div></div>
      <div class="composer">
        <button class="ibtn" id="bFile" title="发送文件"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
        <button class="ibtn hide-sm" id="bDir" title="发送文件夹"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></button>
        <textarea id="inp" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="ibtn primary" id="bSend">发送</button>
      </div>
    </section>
    <section class="view" id="v-files">
      <div class="bar">
        <div class="crumbs" id="crumbs"></div>
        <label class="status" style="cursor:pointer"><input type="checkbox" id="showHidden"> 显示隐藏</label>
        <button class="ibtn" id="bMk" title="新建文件夹">新建文件夹</button>
        <button class="ibtn primary" id="bUpHere">上传到此处</button>
      </div>
      <div id="list"></div>
    </section>
  </main>
</div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="hereIn" multiple hidden>
<div id="login">
  <div class="card">
    <div class="logo" style="margin:0 auto"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></div>
    <h2 id="lgName">连接手机</h2>
    <p>请输入手机 App 上显示的 4 位访问码</p>
    <input class="pin" id="pin" maxlength="4" inputmode="numeric" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button class="primary" id="bLogin">连接</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var msgsEl = $('msgs'), known = {}, es = null, browseAllowed = true;
var curPath = '', queue = [], uploading = false;

function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('show');},2200); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function size(n){ if(n<0) return ''; if(n<1024) return n+' B'; var u=['KB','MB','GB','TB'],i=-1; do{n/=1024;i++;}while(n>=1024&&i<3); return n.toFixed(n<10?2:1)+' '+u[i]; }
function ext(n){ var i=n.lastIndexOf('.'); return i>0? n.slice(i+1).toLowerCase():''; }
function isImg(n){ return /^(jpe?g|png|gif|webp|bmp|svg)$/.test(ext(n)); }
function time(t){ var d=new Date(t),p=function(x){return (x<10?'0':'')+x;}; return p(d.getHours())+':'+p(d.getMinutes()); }
function badge(n,dir){ if(dir) return '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>'; var e=ext(n); return esc(e?e.slice(0,4):'FILE'); }

function api(method, url, body){
  return fetch(url,{method:method,body:body,credentials:'same-origin'}).then(function(r){
    if(r.status===401){ showLogin(); throw new Error('未登录'); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; });
  });
}

// ---------- 登录 ----------
function showLogin(){ if(es){es.close();es=null;} $('login').classList.add('show'); setTimeout(function(){$('pin').focus();},50); }
function doLogin(){
  var pin=$('pin').value.trim(); if(!pin) return;
  $('err').textContent='';
  fetch('/api/login',{method:'POST',body:pin,credentials:'same-origin'}).then(function(r){
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'连接失败'); });
  }).then(function(){ $('login').classList.remove('show'); $('pin').value=''; connect(); })
    .catch(function(e){ $('err').textContent=e.message; $('pin').select(); });
}
$('bLogin').onclick=doLogin;
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
$('pin').addEventListener('input',function(){ if(this.value.length===4) doLogin(); });

function boot(){
  fetch('/api/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(s){
    $('devName').textContent=s.name; $('lgName').textContent='连接 '+s.name; document.title='文件互传 · '+s.name;
    if(s.auth) connect(); else showLogin();
  }).catch(function(){ setStatus(false,'无法连接手机'); setTimeout(boot,3000); });
}

// ---------- 实时消息 ----------
function setStatus(on,t){ $('dot').className='dot'+(on?' on':''); $('stText').textContent=t; }
function connect(){
  if(es) es.close();
  es=new EventSource('/api/events');
  es.onopen=function(){ setStatus(true,'已连接'); };
  es.onerror=function(){
    setStatus(false,'连接断开，正在重连…');
    fetch('/api/state',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(s){ if(!s.auth) showLogin(); }).catch(function(){});
  };
  es.onmessage=function(ev){
    var d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    if(d.t==='init'){
      $('devName').textContent=d.name; browseAllowed=d.browse;
      known={}; msgsEl.querySelectorAll('.row[data-id]').forEach(function(n){n.remove();});
      d.list.forEach(addMsg); updateEmpty(); scrollEnd();
    } else if(d.t==='msg'){ addMsg(d.m); updateEmpty(); scrollEnd();
      if(d.m.from==='phone' && document.hidden) notify(d.m);
    } else if(d.t==='clear'){ known={}; msgsEl.querySelectorAll('.row[data-id]').forEach(function(n){n.remove();}); updateEmpty(); }
  };
}
function notify(m){
  try{ if(window.Notification && Notification.permission==='granted') new Notification('手机发来'+(m.type==='text'?'消息':'文件'),{body:m.type==='text'?m.text:m.name}); }catch(e){}
}
function updateEmpty(){ $('empty').style.display = msgsEl.querySelector('.row') ? 'none':'block'; }
function scrollEnd(){ msgsEl.scrollTop=msgsEl.scrollHeight; }

function addMsg(m){
  if(known[m.id]) return; known[m.id]=1;
  var me = m.from==='pc';
  var row=document.createElement('div'); row.className='row'+(me?' me':''); row.dataset.id=m.id;
  var html='<div class="meta">'+(me?'电脑':'手机')+' · '+time(m.time)+'</div><div class="bubble">';
  if(m.type==='text'){
    html+=linkify(m.text)+'<div class="acts"><button class="chip" data-copy>复制</button></div>';
  } else {
    var url='/api/file?id='+m.id, folder=m.type==='folder';
    if(!folder && isImg(m.name)) html+='<a href="'+url+'&inline=1" target="_blank"><img class="thumb" loading="lazy" src="'+url+'&inline=1" alt=""></a>';
    html+='<a class="file" href="'+url+'" download="'+esc(folder?m.name+'.zip':m.name)+'"><div class="ficon">'+badge(m.name,folder)+'</div><div style="min-width:0"><div class="fname">'+esc(m.name)+'</div><div class="fsize">'+
      (folder?'文件夹 · 点击打包下载':size(m.size)+' · 点击下载')+'</div></div></a>';
  }
  html+='</div>';
  row.innerHTML=html;
  var cp=row.querySelector('[data-copy]');
  if(cp) cp.onclick=function(){ copyText(m.text); };
  msgsEl.appendChild(row);
}
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(function(){toast('已复制');}); return; }
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败'); } ta.remove();
}

// ---------- 发送文字 ----------
var inp=$('inp');
if(window.innerWidth<600) inp.placeholder='输入消息';
function autoGrow(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,160)+'px'; }
inp.addEventListener('input',autoGrow);
inp.addEventListener('keydown',function(e){ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendText(); } });
$('bSend').onclick=sendText;
function sendText(){
  var t=inp.value; if(!t.trim()) return;
  api('POST','/api/text',t).then(function(){ inp.value=''; autoGrow(); }).catch(function(e){ toast('发送失败：'+e.message); });
}

// ---------- 上传 ----------
// 任务: {file, rel, dir, group}
function enqueue(tasks, onDone){
  if(!tasks.length) return;
  tasks.forEach(function(t){ t.onDone=onDone; queue.push(t); });
  if(tasks[0].dir==null){ // 聊天模式下显示进度气泡
    tasks.forEach(function(t){ if(!t.group) t.el=progressBubble(t.file.name,t.file.size); });
    var groups={}; tasks.forEach(function(t){ if(t.group){ groups[t.group]=groups[t.group]||{n:0,s:0,list:[]}; groups[t.group].n++; groups[t.group].s+=t.file.size; groups[t.group].list.push(t);} });
    Object.keys(groups).forEach(function(g){ var G=groups[g], el=progressBubble(g+'（'+G.n+' 个文件）',G.s); el.total=G.s; el.done=0; G.list.forEach(function(t){t.gel=el;}); G.list[G.list.length-1].last={name:g,size:G.s}; });
  }
  pump();
}
function progressBubble(name,sz){
  var row=document.createElement('div'); row.className='row me';
  row.innerHTML='<div class="meta">电脑 · 发送中</div><div class="bubble"><div class="file"><div class="ficon">'+badge(name,false)+'</div><div style="min-width:0"><div class="fname">'+esc(name)+'</div><div class="fsize">'+size(sz)+' · 等待中</div></div></div><div class="prog"><i></i></div><div class="acts"><button class="chip">取消</button></div></div>';
  msgsEl.appendChild(row); updateEmpty(); scrollEnd();
  row.bar=row.querySelector('.prog i'); row.info=row.querySelector('.fsize'); row.cancel=row.querySelector('.chip');
  return row;
}
function pump(){
  if(uploading) return;
  var t=queue.shift(); if(!t) return;
  if(t.cancelled || (t.gel && t.gel.cancelled)){ pump(); return; }
  uploading=true;
  var q='name='+encodeURIComponent(t.file.name);
  if(t.rel) q+='&rel='+encodeURIComponent(t.rel);
  if(t.dir!=null) q+='&dir='+encodeURIComponent(t.dir);
  var xhr=new XMLHttpRequest(), started=Date.now();
  var el=t.gel||t.el;
  if(el){ el.cancel.onclick=function(){ el.cancelled=true; t.cancelled=true; xhr.abort(); }; }
  xhr.open('POST','/api/upload?'+q);
  xhr.upload.onprogress=function(e){
    if(!el||!e.lengthComputable) return;
    var sent=(t.gel?t.gel.done:0)+e.loaded, tot=t.gel?t.gel.total:e.total;
    var sp=e.loaded/Math.max(.2,(Date.now()-started)/1000);
    el.bar.style.width=(tot?sent/tot*100:100)+'%';
    el.info.textContent=size(sent)+' / '+size(tot)+' · '+size(sp)+'/s';
  };
  xhr.onloadend=function(){
    uploading=false;
    var ok=xhr.status===200;
    if(t.gel){ t.gel.done+=t.file.size; }
    if(el && (!t.gel || t.last || !ok)){
      if(ok && t.last){ fetch('/api/folderdone?name='+encodeURIComponent(t.last.name)+'&size='+t.last.size,{method:'POST',credentials:'same-origin'}); }
      if(ok){ el.remove(); } else if(!t.gel || !t.gel.failed){
        if(t.gel) t.gel.failed=true;
        el.querySelector('.meta').textContent= el.cancelled?'已取消':'发送失败';
        el.info.textContent=el.cancelled?'已取消':(errMsg(xhr)||'网络错误'); el.cancel.remove();
        setTimeout(function(){ el.remove(); updateEmpty(); }, 4000);
      }
    }
    if(xhr.status===401) showLogin();
    if(t.onDone && (queue.length===0 || queue[0].onDone!==t.onDone)) t.onDone();
    pump();
  };
  xhr.send(t.file);
}
function errMsg(xhr){ try{ return JSON.parse(xhr.responseText).error; }catch(e){ return ''; } }

$('bFile').onclick=function(){ $('fileIn').click(); };
$('bDir').onclick=function(){ $('dirIn').click(); };
$('fileIn').onchange=function(){ enqueue([].slice.call(this.files).map(function(f){return {file:f};})); this.value=''; };
$('dirIn').onchange=function(){
  var tasks=[].slice.call(this.files).map(function(f){ var rel=f.webkitRelativePath||f.name; return {file:f, rel:rel, group:rel.split('/')[0]}; });
  enqueue(tasks); this.value='';
};

// 拖放（支持文件夹）
var dragDepth=0, main=$('main');
main.addEventListener('dragenter',function(e){ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('drop').textContent= isFilesTab()? '松开上传到当前目录':'松开即可发送到手机'; $('drop').classList.add('show'); });
main.addEventListener('dragover',function(e){ if(hasFiles(e)) e.preventDefault(); });
main.addEventListener('dragleave',function(){ if(--dragDepth<=0){ dragDepth=0; $('drop').classList.remove('show'); } });
main.addEventListener('drop',function(e){
  e.preventDefault(); dragDepth=0; $('drop').classList.remove('show');
  var dir = isFilesTab()? curPath : null;
  if(dir==='' ){ toast('请先进入一个目录'); return; }
  collect(e.dataTransfer).then(function(tasks){
    tasks.forEach(function(t){ t.dir=dir; if(dir!=null){ delete t.group; } });
    enqueue(tasks, dir!=null? function(){ toast('上传完成'); loadDir(curPath); } : null);
    if(dir!=null) toast('正在上传 '+tasks.length+' 个文件…');
  });
});
function hasFiles(e){ return e.dataTransfer && [].indexOf.call(e.dataTransfer.types,'Files')>=0; }
function isFilesTab(){ return $('v-files').classList.contains('active'); }
function collect(dt){
  var items=dt.items, entries=[];
  if(items && items.length && items[0].webkitGetAsEntry){
    for(var i=0;i<items.length;i++){ var en=items[i].webkitGetAsEntry(); if(en) entries.push(en); }
    var out=[];
    return Promise.all(entries.map(function(en){ return walk(en,'',out,en.isDirectory?en.name:null); })).then(function(){ return out; });
  }
  return Promise.resolve([].slice.call(dt.files).map(function(f){return {file:f};}));
}
function walk(en,prefix,out,group){
  if(en.isFile) return new Promise(function(res){ en.file(function(f){ out.push(group? {file:f, rel:prefix+f.name, group:group} : {file:f}); res(); }, function(){res();}); });
  return new Promise(function(res){
    var rd=en.createReader(), all=[];
    (function read(){ rd.readEntries(function(list){
      if(!list.length){ Promise.all(all.map(function(c){ return walk(c,prefix+en.name+'/',out,group); })).then(res); return; }
      all=all.concat([].slice.call(list)); read();
    }, function(){res();}); })();
  });
}
// 粘贴截图/文件
document.addEventListener('paste',function(e){
  if(!e.clipboardData || isFilesTab()) return;
  var fs=[].slice.call(e.clipboardData.files||[]);
  if(fs.length){ e.preventDefault(); enqueue(fs.map(function(f){
    var name=f.name; if(!name || name==='image.png'){ var d=new Date(); name='截图_'+d.getFullYear()+(d.getMonth()+1)+d.getDate()+'_'+d.getHours()+d.getMinutes()+d.getSeconds()+'.png'; }
    return {file:new File([f],name,{type:f.type})}; })); }
});

// ---------- 手机文件浏览 ----------
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('active',x===b);});
    $('v-chat').classList.toggle('active',b.dataset.tab==='chat');
    $('v-files').classList.toggle('active',b.dataset.tab==='files');
    if(b.dataset.tab==='files') loadDir(curPath);
  };
});
var lastList=null, rootsCache=[];
$('showHidden').onchange=function(){ if(lastList) renderList(lastList); };
function loadDir(p){
  if(!browseAllowed){ $('list').innerHTML='<div class="note">手机端已关闭"允许电脑浏览手机文件"。</div>'; $('crumbs').innerHTML=''; return; }
  $('list').innerHTML='<div class="note">加载中…</div>';
  api('GET','/api/ls?path='+encodeURIComponent(p)).then(function(j){
    curPath=j.path; if(!j.path) rootsCache=j.items; lastList=j; renderCrumbs(j); renderList(j);
  }).catch(function(e){ $('list').innerHTML='<div class="note">'+esc(e.message)+'</div>'; });
}
function renderCrumbs(j){
  var c=$('crumbs'); c.innerHTML='';
  var b=document.createElement('button'); b.textContent='存储'; b.onclick=function(){loadDir('');}; c.appendChild(b);
  if(!j.path) return;
  var root=null; rootsCache.forEach(function(r){ if(j.path===r.p || j.path.indexOf(r.p+'/')===0) root=r; });
  var base=root?root.p:'', rest=root? j.path.slice(base.length):j.path;
  var acc=base;
  if(root){ add(root.l||root.n, base); }
  rest.split('/').forEach(function(seg){ if(!seg) return; acc+='/'+seg; add(seg,acc); });
  function add(label,path){ var s=document.createElement('span'); s.textContent='›'; c.appendChild(s); var x=document.createElement('button'); x.textContent=label; x.onclick=function(){loadDir(path);}; c.appendChild(x); }
  c.scrollLeft=c.scrollWidth;
}
function renderList(j){
  var L=$('list'); L.innerHTML='';
  var hid=$('showHidden').checked;
  var items=j.items.filter(function(it){ return hid || it.n.charAt(0)!=='.'; });
  if(j.parent){ var up=row({n:'..',d:true,p:j.parent,up:1}); L.appendChild(up); }
  if(!items.length && !j.parent && j.path){ L.innerHTML='<div class="note">空文件夹</div>'; }
  items.forEach(function(it){ L.appendChild(row(it)); });
  if(!items.length && j.path) L.insertAdjacentHTML('beforeend','<div class="note">空文件夹</div>');
  function row(it){
    var d=document.createElement('div'); d.className='it';
    var title=it.up?'返回上一级':(it.l||it.n);
    var sub=it.up?'':(it.d? (it.lk?'🔒 需在手机上授权后访问': (it.l&&it.l!==it.n? it.n+' · ':'')+fmtDate(it.t)) : size(it.s)+' · '+fmtDate(it.t));
    d.innerHTML='<div class="ficon'+(it.d?' dir':'')+'">'+badge(it.n,it.d)+'</div><div class="nm"><div>'+esc(title)+'</div><div class="sub">'+esc(sub)+'</div></div>'+
      (it.up?'':'<a class="ibtn dlb" title="'+(it.d?'打包下载':'下载')+'" href="/api/dl?path='+encodeURIComponent(it.p)+'" download><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></a>');
    var a=d.querySelector('a'); if(a) a.onclick=function(e){ e.stopPropagation(); };
    d.onclick=function(){
      if(it.d){ if(it.lk){ toast('请在手机 App 里点开这个目录完成授权'); return; } loadDir(it.p); }
      else if(isImg(it.n)) window.open('/api/dl?path='+encodeURIComponent(it.p)+'&inline=1','_blank');
      else location.href='/api/dl?path='+encodeURIComponent(it.p);
    };
    return d;
  }
}
function fmtDate(t){ if(!t) return ''; var d=new Date(t),p=function(x){return (x<10?'0':'')+x;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
$('bUpHere').onclick=function(){ if(!curPath){ toast('请先进入一个目录'); return; } $('hereIn').click(); };
$('hereIn').onchange=function(){
  var dir=curPath, fs=[].slice.call(this.files); this.value='';
  toast('正在上传 '+fs.length+' 个文件…');
  enqueue(fs.map(function(f){return {file:f, dir:dir};}), function(){ toast('上传完成'); if(curPath===dir) loadDir(dir); });
};
$('bMk').onclick=function(){
  if(!curPath){ toast('请先进入一个目录'); return; }
  var n=prompt('新文件夹名称','新建文件夹'); if(!n) return;
  api('POST','/api/mkdir?dir='+encodeURIComponent(curPath)+'&name='+encodeURIComponent(n)).then(function(){ loadDir(curPath); }).catch(function(e){ toast(e.message); });
};
document.addEventListener('click',function once(){ try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){} document.removeEventListener('click',once); });

boot();
})();
</script>
